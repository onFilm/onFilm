name: send me a joke v2

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  send-a-joke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: fetch-joke
        id: api
        run: |
          response=$(curl --location --request GET https://official-joke-api.appspot.com/jokes/random)
          setup=$(jq -r '.setup' <<< "${response}")
          punchline=$(jq -r '.punchline' <<< "${response}")
          # Save formatted joke
          joke_html="<strong>Setup:</strong> ${setup}<br><strong>Punchline:</strong> ${punchline}"
          echo "joke=${joke_html}" >> $GITHUB_ENV
          echo "setup=${setup}" >> $GITHUB_ENV
          echo "punchline=${punchline}" >> $GITHUB_ENV

      - name: Ensure Jokes Directory
        run: mkdir -p jokes

      - name: Save Joke to Monthly File
        run: |
          month_file="jokes/$(date +%Y-%m).txt"
          echo "----- $(date +%Y-%m-%d) -----" >> "$month_file"
          echo "${{ env.joke }}" >> "$month_file"
          echo "" >> "$month_file"

      - name: Update CSV & JSON Logs
        run: |
          mkdir -p jokes
          csv_file="jokes/stats.csv"
          json_file="jokes/stats.json"
      
          # Read environment variables into Bash variables
          setup="$setup"
          punchline="$punchline"
      
          # Compute joke length
          joke_length=$(( ${#setup} + ${#punchline} ))
      
          # Add CSV header if missing
          if [ ! -f "$csv_file" ]; then
            echo "date,setup,punchline,length" > "$csv_file"
          fi
      
          # Append to CSV
          echo "$(date +%Y-%m-%d),$setup,$punchline,$joke_length" >> "$csv_file"
      
          # Append to JSON
          if [ -f "$json_file" ]; then
            jq --arg d "$(date +%Y-%m-%d)" \
               --arg s "$setup" \
               --arg p "$punchline" \
               --argjson l "$joke_length" \
               '.jokes += [{"date": $d, "setup": $s, "punchline": $p, "length": $l}]' \
               "$json_file" > tmp.json && mv tmp.json "$json_file"
          else
            echo "{\"jokes\":[{\"date\":\"$(date +%Y-%m-%d)\",\"setup\":\"$setup\",\"punchline\":\"$punchline\",\"length\":$joke_length}]}" > "$json_file"
          fi

      - name: Compute Stats
        id: stats
        run: |
          month_file="jokes/$(date +%Y-%m).txt"
          total_jokes=$(grep -h "-----" jokes/*.txt | wc -l | xargs)
          jokes_this_month=$(grep -h "-----" "$month_file" | wc -l | xargs)
          first_joke=$(grep -h "-----" jokes/*.txt | head -1 | sed 's/----- \(.*\) -----.*/\1/')
          last_joke=$(grep -h "-----" jokes/*.txt | tail -1 | sed 's/----- \(.*\) -----.*/\1/')
          # Longest joke of the month
          longest_joke=$(jq '.jokes | max_by(.length) | "\(.setup) - \(.punchline)"' jokes/stats.json)
          # ASCII trend chart (simple bars)
          trend=$(grep -h "-----" "$month_file" | nl | awk '{printf "%s: %s\n", $1, gensub(/./,"▇","g",$1)}')
          echo "total_jokes=$total_jokes"       >> $GITHUB_OUTPUT
          echo "jokes_this_month=$jokes_this_month" >> $GITHUB_OUTPUT
          echo "first_joke=$first_joke"         >> $GITHUB_OUTPUT
          echo "last_joke=$last_joke"           >> $GITHUB_OUTPUT
          echo "longest_joke=$longest_joke"     >> $GITHUB_OUTPUT
          echo "trend=$trend"                   >> $GITHUB_OUTPUT

      - name: Send Email
        uses: dawidd6/action-send-mail@v2
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "😂 Your Daily Joke Is Here!"
          body: |
            <div style="font-family: Arial, sans-serif; font-size:16px; line-height:1.6; padding:20px; background:#f7f8fa;">
              <h2>🌤️ Daily Joke Delivery</h2>
              <p style="margin: 0; font-size: 14px; color: #666;">
                Your daily dose of laughter for <strong>${{ github.event.schedule || github.event.workflow_dispatch && 'today' }} 😄</strong>
              </p>
              <div style="background:#fff; border-left:5px solid #007bff; padding:15px; margin:10px 0;">
                ${{ env.joke }}
              </div>
              <h3>📊 Stats</h3>
              <ul>
                <li><strong>Total jokes sent:</strong> ${{ steps.stats.outputs.total_jokes }} 🎉</li>
                <li><strong>Jokes this month:</strong> ${{ steps.stats.outputs.jokes_this_month }} 📅</li>
                <li><strong>First joke:</strong> ${{ steps.stats.outputs.first_joke }} 🏁</li>
                <li><strong>Latest joke:</strong> ${{ steps.stats.outputs.last_joke }} 🔄</li>
                <li><strong>Funniest joke of month:</strong> ${{ steps.stats.outputs.longest_joke }} 🤣</li>
              </ul>
              <p>Thanks for reading — hope this gave you a smile! 😁</p>
              <pre>${{ steps.stats.outputs.trend }}</pre>
              <p>Cheers,<br><strong>Prajwal</strong> ✨</p>
            </div>
          to: mail2prajwal12@gmail.com, nistharadinesh@gmail.com, gurusworkout@gmail.com
          bcc: abhi03989@gmail.com
          convert_markdown: true
          content_type: text/html
          from: Prajwal Acharya

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add jokes/
          TIMESTAMP=$(date +"%Y-%m-%d %H:%M:%S")
          git commit -m "Update joke, logs, stats at $TIMESTAMP"
          git push
